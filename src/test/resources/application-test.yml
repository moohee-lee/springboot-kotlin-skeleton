spring:
  datasource:
    write:
      hikari:
        pool-name: write-test-hikari-pool
        jdbc-url: jdbc:tc:postgresql:18-alpine:///skeleton_write?TC_INITSCRIPT=db/schema.sql
        username: sa
        password:
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
        minimum-idle: 1
        maximum-pool-size: 3
    read:
      hikari:
        pool-name: read-test-hikari-pool
        jdbc-url: jdbc:tc:postgresql:18-alpine:///skeleton_read?TC_INITSCRIPT=db/schema.sql
        username: sa
        password:
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
        minimum-idle: 1
        maximum-pool-size: 3

logging:
  level:
    api.raw: "OFF"
    reactor.netty.http.server.AccessLog: "OFF"
    com.example.skeleton: DEBUG
    org.springframework: ERROR
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.transaction: DEBUG
