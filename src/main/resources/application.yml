server:
  port: 18080
  shutdown: graceful

spring:
  application:
    name: kcp-network-skeleton
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 70s
  messages:
    basename: messages/message,validations/validation,enums/enum,errors/error
    fallback-to-system-locale: false
  web:
    locale: ko_KR

management:
  endpoints:
    web:
      exposure:
        include: "*"

ktcloud:
  web-access-log:
    max-body-size: 32768
    masked-keys:
      - password
      - passwd
      - pwd
      - secret
      - clientSecret
      - accessToken
      - refreshToken
      - authorization
    admin-path-patterns: []
    system-path-patterns:
      - /actuator/**

