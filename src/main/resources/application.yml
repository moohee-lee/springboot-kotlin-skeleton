server:
  port: 18080
  shutdown: graceful

app:
  config:
    print-properties-on-startup: false   # 기동 시 로드된 property source 출력 (보고 싶을 때만 true)
    print-system-properties-on-startup: false  # systemProperties / systemEnvironment 까지 출력
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: false
    max-age: 3600

spring:
  application:
    name: kcp-network-skeleton
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 70s
  messages:
    basename: messages/message,validations/validation,enums/enum,errors/error
    fallback-to-system-locale: false
  web:
    locale: ko_KR

management:
  endpoints:
    web:
      exposure:
        include: "*"

ktcloud:
  web-access-log:
    max-body-size: 32768
    masked-keys:
      - password
      - passwd
      - pwd
      - secret
      - clientSecret
      - accessToken
      - refreshToken
      - authorization
    admin-path-patterns: []
    system-path-patterns:
      - /actuator/**

