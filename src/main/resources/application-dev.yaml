spring:
  config:
    import:
      - vault://secret/mgmt01/ns-vpc/postgresql?prefix=db.
      - vault://secret/mgmt01/ns-vpc/redis
  cloud:
    vault:
      uri: ${VAULT_URI}
      authentication: kubernetes
      kubernetes:
        role: role-vpc
        kubernetes-path: mgmt01

logging:
  level:
    com.ktcloud.network.skeleton: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
