spring:
  config:
    import:
      # 뒤에 선언한 import 가 우선순위가 높다. ConfigMap 이 Vault 를 덮어쓰는 기존 순서 유지.
      - vault://secret/${VAULT_CLUSTER}/ns-vpc/postgresql?prefix=db.
      - vault://secret/${VAULT_CLUSTER}/ns-vpc/redis
      - "kubernetes:"
  cloud:
    vault:
      uri: ${VAULT_URI}
      authentication: kubernetes
      kubernetes:
        role: role-vpc
        kubernetes-path: ${VAULT_CLUSTER}
    kubernetes:
      config:
        enabled: true
        namespace: ${KUBERNETES_NAMESPACE}
        sources:
          - name: ns-network-skeleton
            namespace: ${KUBERNETES_NAMESPACE}
          - name: ns-vpc-postgres
            namespace: ${KUBERNETES_NAMESPACE}
